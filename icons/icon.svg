<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <filter id="gp" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"  result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="gb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bloom" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28"/>
    </filter>

    <radialGradient id="bggrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#110d2a"/>
      <stop offset="100%" stop-color="#04020f"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="40" y1="0" x2="0" y2="0" stroke="#8a2be2" stroke-width="0.6" opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#8a2be2" stroke-width="0.6" opacity="0.12"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="50%"  stop-color="#04020f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04020f" stop-opacity="0.9"/>
    </radialGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" fill="url(#bggrad)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#vig)"/>

  <!-- ── Stars ── -->
  <circle cx="82"  cy="115" r="1.5" fill="#e8d5ff" opacity="0.6"/>
  <circle cx="155" cy="72"  r="1.0" fill="#00d4ff" opacity="0.5"/>
  <circle cx="430" cy="135" r="1.5" fill="#bf5fff" opacity="0.6"/>
  <circle cx="385" cy="88"  r="1.0" fill="#e8d5ff" opacity="0.4"/>
  <circle cx="96"  cy="415" r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="428" cy="408" r="1.0" fill="#bf5fff" opacity="0.6"/>
  <circle cx="56"  cy="265" r="1.0" fill="#e8d5ff" opacity="0.3"/>
  <circle cx="464" cy="272" r="1.5" fill="#00d4ff" opacity="0.4"/>
  <circle cx="210" cy="52"  r="1.0" fill="#bf5fff" opacity="0.35"/>
  <circle cx="460" cy="180" r="1.0" fill="#e8d5ff" opacity="0.3"/>
  <circle cx="48"  cy="350" r="1.0" fill="#bf5fff" opacity="0.35"/>

  <!-- ── Outer blue border ── -->
  <rect x="10" y="10" width="492" height="492" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.28" rx="6"/>
  <!-- ── Inner purple border ── -->
  <rect x="18" y="18" width="476" height="476" fill="none" stroke="#8a2be2" stroke-width="1" opacity="0.35" rx="3"/>

  <!-- ── Corner brackets ── -->
  <polyline points="18,72 18,18 72,18"       fill="none" stroke="#bf5fff" stroke-width="6" stroke-linecap="square" filter="url(#gp)"/>
  <polyline points="440,18 494,18 494,72"    fill="none" stroke="#bf5fff" stroke-width="6" stroke-linecap="square" filter="url(#gp)"/>
  <polyline points="18,440 18,494 72,494"    fill="none" stroke="#bf5fff" stroke-width="6" stroke-linecap="square" filter="url(#gp)"/>
  <polyline points="494,440 494,494 440,494" fill="none" stroke="#bf5fff" stroke-width="6" stroke-linecap="square" filter="url(#gp)"/>

  <!-- ── Accent scan lines framing the letters ── -->
  <line x1="80" y1="132" x2="432" y2="132" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
  <line x1="80" y1="380" x2="432" y2="380" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>

  <!-- ════════════════════════════════════════
       C  LETTER  —  electric blue  #00d4ff
       x=104, y=146, w=130, h=220, bar=32
       ════════════════════════════════════════ -->

  <!-- soft bloom behind C -->
  <rect x="104" y="146" width="130" height="220" rx="12" fill="#00d4ff" opacity="0.07" filter="url(#bloom)"/>

  <!-- top bar -->
  <rect x="104" y="146" width="130" height="32" rx="4" fill="#00d4ff" filter="url(#gb)"/>
  <!-- left bar -->
  <rect x="104" y="146" width="32"  height="220" rx="4" fill="#00d4ff" filter="url(#gb)"/>
  <!-- bottom bar -->
  <rect x="104" y="334" width="130" height="32" rx="4" fill="#00d4ff" filter="url(#gb)"/>

  <!-- ════════════════════════════════════════
       S  LETTER  —  neon purple  #bf5fff
       Bezier S-curve: starts top-right, arcs LEFT
       through top half, crosses center, arcs RIGHT
       through bottom half, ends bottom-left.
       ════════════════════════════════════════ -->
  <path d="M 402,162 C 432,140 274,190 340,256 C 408,322 416,358 286,350"
        fill="none" stroke="#bf5fff" stroke-width="40" stroke-linecap="round"
        filter="url(#gp)"/>

</svg>
